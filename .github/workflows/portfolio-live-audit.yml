name: Portfolio public Pages live audit
on:
  pull_request:
    paths:
      - 'scripts/portfolio_live_audit.py'
      - 'tests/test_portfolio_live_audit.py'
      - '.github/workflows/portfolio-live-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/portfolio_live_audit.py'
      - 'tests/test_portfolio_live_audit.py'
      - '.github/workflows/portfolio-live-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test URL, scope, alias and artifact selection
        run: python -m unittest discover -s tests -p test_portfolio_live_audit.py -v
  audit:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only browser QA
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Discover and check public Pages plus priority browser samples
        run: python scripts/portfolio_live_audit.py --browser-limit 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-public-live-evidence
          path: portfolio-audit-artifacts/
          if-no-files-found: warn
          retention-days: 30
